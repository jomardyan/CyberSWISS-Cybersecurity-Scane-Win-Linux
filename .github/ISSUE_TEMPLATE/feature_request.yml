name: Feature request
description: Suggest an improvement to the orchestrator, reporting, API, or GUI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Orchestrator / CLI
        - Reporting formats
        - Scan history, drift, trend
        - Baselines / accepted risk
        - REST API
        - GUI
        - CI/CD integration
        - Documentation
    validations:
      required: true
